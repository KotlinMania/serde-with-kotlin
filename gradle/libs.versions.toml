[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
base64-kotlin = "0.1.0"
indexmap-kotlin = "0.1.5"
serde-kotlin = "0.1.11"
serde-test-kotlin = "0.1.1"
serde-json-kotlin = "0.1.1"
schemars-kotlin = "0.1.3"
pretty-assertions-kotlin = "0.1.0"
glob-kotlin = "0.1.2"
regex-kotlin = "0.1.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
base64-kotlin = { module = "io.github.kotlinmania:base64-kotlin", version.ref = "base64-kotlin" }
indexmap-kotlin = { module = "io.github.kotlinmania:indexmap-kotlin", version.ref = "indexmap-kotlin" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde-kotlin" }
serde-test-kotlin = { module = "io.github.kotlinmania:serde-test-kotlin", version.ref = "serde-test-kotlin" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serde-json-kotlin" }
schemars-kotlin = { module = "io.github.kotlinmania:schemars-kotlin", version.ref = "schemars-kotlin" }
pretty-assertions-kotlin = { module = "io.github.kotlinmania:pretty-assertions-kotlin", version.ref = "pretty-assertions-kotlin" }
glob-kotlin = { module = "io.github.kotlinmania:glob-kotlin", version.ref = "glob-kotlin" }
regex-kotlin = { module = "io.github.kotlinmania:regex-kotlin", version.ref = "regex-kotlin" }

[bundles]
serde-with-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "base64-kotlin",
  "indexmap-kotlin",
  "serde-kotlin",
  "serde-json-kotlin",
  "schemars-kotlin",
]
serde-with-commonTest = [
  "pretty-assertions-kotlin",
  "serde-test-kotlin",
]

